name: verify-pr10
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kv: 1.3.39
            java: '21'
          - kv: 2.0.2
            java: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: retarget build to JVM 25 for kestra 2.x dependency resolution
        if: matrix.kv == '2.0.2'
        run: sed -i 's/JavaVersion.VERSION_21/JavaVersion.VERSION_25/' build.gradle
      - name: gradle check (kestra ${{ matrix.kv }})
        run: ./gradlew check -PkestraVersion=${{ matrix.kv }} --console=plain --stacktrace
