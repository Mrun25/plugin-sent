plugins {
    id 'io.kestra.gradle.repository-conventions' version '1.2.12'
    id "com.vanniktech.maven.publish" version "0.37.0"
    id "io.kestra.gradle.inject-bom-versions" version '1.2.12'
    id "io.kestra.gradle.plugin-doc-lint" version '1.2.12'
    id 'io.kestra.gradle.spotless-conventions' version '1.2.12'
    id 'java-library'
    id "idea"
    id 'jacoco'
    id "com.gradleup.shadow" version "9.6.1"
    id 'signing'
    id 'net.researchgate.release' version '3.2.0'
}

// Formatting must not install Git hooks or modify the staging area.
tasks.matching { it.name == 'setupHooks' }.configureEach {
    enabled = false
}

def isBuildSnapshot = version.toString().endsWith("-SNAPSHOT")

repositories {
    mavenLocal()
    mavenCentral()
    if (isBuildSnapshot) {
        maven { url = "https://central.sonatype.com/repository/maven-snapshots/" }
    }
}

final targetJavaVersion = JavaVersion.VERSION_21

java {
    sourceCompatibility = targetJavaVersion
    targetCompatibility = targetJavaVersion
}

group = "io.kestra.plugin"
description = 'Sent plugin for Kestra'

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs.add("-parameters")
}

dependencies {
    // Platform
    annotationProcessor enforcedPlatform("io.kestra:platform:$kestraVersion")
    implementation enforcedPlatform("io.kestra:platform:$kestraVersion")

    // lombok
    annotationProcessor "org.projectlombok:lombok"
    compileOnly "org.projectlombok:lombok"

    // kestra
    annotationProcessor "io.kestra:processor:$kestraVersion"
    compileOnly "io.kestra:core:$kestraVersion"
    compileOnly "io.kestra:script:$kestraVersion"
}


/**********************************************************************************************************************\
 * Test
 **********************************************************************************************************************/
test {
    useJUnitPlatform {
        excludeTags 'webhook-integration'
    }
    // Dummy Base64-encoded API key used only by local, mocked tests.
    environment 'SECRET_SENT_API_KEY', 'c2VudC10ZXN0LWFwaS1rZXk='
}

tasks.register('webhookIntegrationTest', Test) {
    description = 'Tests the signed webhook through an isolated running Kestra 1.3.39 HTTP server.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'webhook-integration'
    }
    systemProperty 'sent.kestraUrl', providers.gradleProperty('kestraUrl').getOrElse('')
    systemProperty 'sent.kestraUser', providers.gradleProperty('kestraUser').getOrElse('review@example.invalid')
    systemProperty 'sent.kestraPassword', providers.gradleProperty('kestraPassword').getOrElse('SentLocalReviewOnly2026!')
}

dependencies {
    // Platform
    testAnnotationProcessor enforcedPlatform("io.kestra:platform:$kestraVersion")
    testImplementation enforcedPlatform("io.kestra:platform:$kestraVersion")

    // lombok
    testAnnotationProcessor "org.projectlombok:lombok"
    testCompileOnly 'org.projectlombok:lombok'

    // micronaut
    testAnnotationProcessor "io.micronaut:micronaut-inject-java"
    testAnnotationProcessor "io.micronaut.validation:micronaut-validation-processor"
    testImplementation "io.micronaut.test:micronaut-test-junit5"
    testImplementation "io.micronaut:micronaut-jackson-databind"

    // test deps needed only for to have a runner
    testAnnotationProcessor "io.kestra:processor:$kestraVersion"
    testImplementation "io.kestra:core:$kestraVersion"
    testImplementation "io.kestra:tests:$kestraVersion"
    testImplementation "io.kestra:script:$kestraVersion"
    testImplementation "io.kestra:repository-memory:$kestraVersion"
    testImplementation "io.kestra:runner-memory:$kestraVersion"
    testImplementation "io.kestra:storage-local:$kestraVersion"
    testImplementation 'org.wiremock:wiremock-jetty12'
    testImplementation 'io.opentelemetry:opentelemetry-api'

    // test
    testImplementation "org.junit.jupiter:junit-jupiter-engine"
    testImplementation "org.hamcrest:hamcrest"
    testImplementation "org.hamcrest:hamcrest-library"
}

/**********************************************************************************************************************\
 * Allure Reports
 **********************************************************************************************************************/
dependencies {
    testImplementation enforcedPlatform("io.kestra:platform:$kestraVersion")
    testImplementation "io.qameta.allure:allure-junit5"
}

/**********************************************************************************************************************\
 * Jacoco
 **********************************************************************************************************************/
test {
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required.set(true)
    }
}

/**********************************************************************************************************************\
 * Publish
 **********************************************************************************************************************/
mavenPublishing {
    publishToMavenCentral(true)
    signAllPublications()
    coordinates("${project.group}", "${project.name}", "${project.version}")
    pom {
        name = "${project.name}"
        description = "${project.group}:${project.name}:${project.version}"
        url = "https://github.com/kestra-io/${project.name}"
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }
        developers {
            developer {
                id = 'tchiotludo'
                name = 'Dehon'
                email = 'ldehon@kestra.io'
            }
        }
        scm {
            connection = 'scm:git:'
            url = "https://github.com/kestra-io/${project.name}"
        }
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    // Suppression this validation error as we want to enforce the Kestra platform
    suppressedValidationErrors.add('enforced-platform')
}

jar {
    manifest {
        attributes(
            "X-Kestra-Name": project.name,
            "X-Kestra-Title": "Sent",
            "X-Kestra-Group": project.group + ".sent",
            "X-Kestra-Description": project.description,
            "X-Kestra-Version": project.version
        )
    }
}

shadowJar {
    archiveClassifier.set(null)
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    mergeServiceFiles()
}

/**********************************************************************************************************************\
 * Version
 **********************************************************************************************************************/
release {
    preCommitText = 'chore(version):'
    preTagCommitMessage = 'update to version'
    tagCommitMessage = 'tag version'
    newVersionCommitMessage = 'update snapshot version'
    tagTemplate = 'v${version}'
    buildTasks = ['classes']
    git {
        requireBranch.set('main')
    }
}

/**********************************************************************************************************************\
 * Dev
 **********************************************************************************************************************/
idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
